<!-- Bridge 99 — primary logo lockup
     Two 9s connected by a hairline span (the bridge).
     Deck line + two piers echo the forest-service concrete span over the Metolius.
     Designed to work alone (monogram) or with wordmark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" role="img" aria-label="Bridge 99">
  <defs>
    <linearGradient id="b99-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#2AA3C9"/>
    </linearGradient>
  </defs>

  <!-- Monogram: 99 -->
  <!-- First 9 -->
  <g fill="none" stroke="url(#b99-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 9 as circle + tail -->
    <circle cx="14" cy="18" r="8"/>
    <path d="M22 18 L22 36"/>
    <!-- Second 9 -->
    <circle cx="42" cy="18" r="8"/>
    <path d="M50 18 L50 36"/>
  </g>

  <!-- The bridge: hairline span connecting the two 9s -->
  <!-- Deck line -->
  <line x1="2" y1="42" x2="62" y2="42" stroke="#0A2540" stroke-width="2" stroke-linecap="square"/>
  <!-- Piers (small vertical ticks suggesting the concrete span) -->
  <line x1="8" y1="42" x2="8" y2="46" stroke="#0A2540" stroke-width="2"/>
  <line x1="32" y1="42" x2="32" y2="46" stroke="#0A2540" stroke-width="2"/>
  <line x1="56" y1="42" x2="56" y2="46" stroke="#0A2540" stroke-width="2"/>

  <!-- Wordmark: Bridge 99 -->
  <text x="74" y="30"
        font-family="'Inter', 'Helvetica Neue', system-ui, sans-serif"
        font-size="18"
        font-weight="700"
        letter-spacing="-0.02em"
        fill="#0A2540">Bridge<tspan dx="4" fill="url(#b99-grad)">99</tspan></text>
</svg>
